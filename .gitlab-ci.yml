stages:
  - genLicense
  - checkLicense
  - build_B80_BLE
  - build_B80B_BLE
  - build_all_2_4g_feature
  - build_all_ble_feature
  - clean_build
  - plainPW_check
  - oss
  - cov
  - fossid
  - release_customize_sdk

genLicense:
  variables:
    CODE_COMPILE_ARCH: 'TC32'
    COV_PF_CATALOG: 'BLE'
  stage: genLicense
  tags:
    - LINUX
  before_script:
  script:
    - date
    - generat_license_list
    - date
  artifacts:
    paths:
    - "license_list_gen.txt"
    - "no_license_list_gen.txt"
    - "mismatch_license_file_gen.txt"
  when: manual
  
checkLicense:
  variables:
    CODE_COMPILE_ARCH: 'TC32'
    COV_PF_CATALOG: 'BLE'
  stage: checkLicense
  tags:
    - LINUX
  allow_failure: yes
  before_script:
  script:
    - date
    - check_license
    #- generat_license_list # For no license files
    - date
  artifacts:
    when: always
    paths:
    - "mismatch_license.txt"
    - "no_license*.txt"
    - "unknow_type_file.txt"

build_B80_BLE:
  stage: build_B80_BLE
  variables:
    ECLIPSE_PROJECT_PATH: './b80_ble_sdk/project/tlsr_tc32/B80'
    ECLIPSE_PROJECT_NAME: 'tc_ble_simple_b80_sdk'
  tags:
    - LINUX
    - TC32
  before_script:
  script:
    - which tc32-elf-gcc
    - chmod +x b80_ble_sdk/script/tl_check_fw/*.sh
    - date
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80_2_4g_genfsk
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80_2_4g_tpll
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80_2_4g_tpsll
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80_ble_sample
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80_ble_slave_2_4g
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80_master
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80_module
    - date

  artifacts:
    paths:
    - "./b80_ble_sdk/project/tlsr_tc32/B80/**/*.lst"
    - "./b80_ble_sdk/project/tlsr_tc32/B80/**/*.bin"
    - "*.bin"
    - "*.lst"
  
  when: always

build_B80B_BLE:
  stage: build_B80B_BLE
