clean_build:
  stage: clean_build
  tags:
    - LINUX
    - TC32
  script:
    - ls -a
    - rm -r * .git*
    - ls -a
  when: always
  
plainPW_check:
  stage: plainPW_check 
  tags:
    - LINUX
  script:
    - echo "Enter Plain Password checking stage"
    - check_plain_weak_password | tee result.txt
    - ls -l result.txt
    - echo "Error List:"
    - cat result.txt
  artifacts:
    paths:
    - result.txt
  when: manual

# The cov job definition
cov:
  variables:
    CODE_COMPILE_ARCH: 'TC32'
    COV_PF_CATALOG: 'BLE'
  stage: cov
  tags:
    - COV    
    - LINUX    
    - TC32
  before_script:
  script:
    - chmod +x b80_ble_sdk/script/tl_check_fw/*.sh
    - chmod +x b80_ble_sdk/script/bin_append_crc/*.sh
    - $COV_B COV_$CI_PROJECT_NAME $COV_B_TEMPLATE/$CODE_COMPILE_ARCH $TC32_ECLIPSE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $'./b80_ble_sdk/project/tlsr_tc32/B80/' -cleanBuild b80_ble_sdk/8208_ble_sample
    - $COV_A COV_$CI_PROJECT_NAME 
    - cov_add_commit_steam_project_2_platform.sh
  when: manual

oss:
  tags:
    - OSS
  stage: oss
  script:
    - oss_checking .
  artifacts:
    when: always
    paths:
    - scan_result
  when: manual

fossid:
  tags:
    - FOSSID
  stage: fossid
  script:
    - fossid_check.sh
  artifacts:
    paths:
    - fossid*.txt
  when: manual

.release_sdk_template: &release_sdk_template
  variables:
    PACK_NAME: "release_sdk_template"
  stage: release_customize_sdk	
  tags:
    - windows_tc32_test
  before_script:
    - echo "get ci release sdk shell"
    - >
      if [ ${#PRIVATE_TOKEN_SELF} != 0 ]; then
        clone_url="http://oauth2:${PRIVATE_TOKEN_SELF}@192.168.48.36/training_zone/ci_common_shell"
      elif [ ${#PRIVATE_TOKEN} != 0 ]; then
        clone_url="http://oauth2:${PRIVATE_TOKEN}@192.168.48.36/training_zone/ci_common_shell"
      else
        echo "have no find token."
        exit 1
      fi

    - git clone $clone_url
    - ls ci_common_shell
    - cp ci_common_shell/sdk_release_customize-2.0.sh ./
    - ls
  script:
    - chmod +x ./sdk_release_customize-2.0.sh
    - ./sdk_release_customize-2.0.sh ./release_sdk_config
  artifacts:
    name: "$PACK_NAME"
    expire_in: '3 yrs'
    paths:
    - "./b80_ble_sdk"
    - "./README.md"
    - "./doc"
  when: manual

release_sdk_P5_B80:
  <<: *release_sdk_template
  variables:
    PACK_NAME: "tc_ble_simple_sdk_B80_V3.4.2.2_P5"

