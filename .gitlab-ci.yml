    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80B_ble_slave_2_4g
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $ECLIPSE_PROJECT_PATH  -cleanBuild $ECLIPSE_PROJECT_NAME/b80B_master
