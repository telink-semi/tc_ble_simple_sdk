build_all_2_4g_feature:
  stage: build_all_2_4g_feature
  tags:
    - LINUX
    - TC32
  before_script:
  script:
    - which tc32-elf-gcc
    - chmod +x b80_ble_sdk/script/tl_check_fw/*.exe
    - chmod +x b80_ble_sdk/script/bin_append_crc/*.exe
    - chmod +x b80_ble_sdk/script/tl_check_fw/*.sh
    - chmod +x b80_ble_sdk/script/bin_append_crc/*.sh
    - date
    - MACRO='FEATURE_TEST_MODE'
    - MACRO_VAL='OTA'
    - MACRO_PATH='./b80_ble_sdk/vendor/2_4g_feature/feature_config.h'
    - sed  -i "/#define\s\+${MACRO}/c#define ${MACRO}\t\t${MACRO_VAL}" $MACRO_PATH
    - $TELINK_IDE_BUILD  -data ${CI_PIPELINE_ID}_WS  -import $'./b80_ble_sdk/project/tlsr_tc32/B80/' -cleanBuild $'tc_ble_simple_b80_sdk/b80_2_4g_feature'
